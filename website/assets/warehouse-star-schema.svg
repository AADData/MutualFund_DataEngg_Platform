<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mutual Fund Data Warehouse Star Schema</title>
  <desc id="desc">Star schema showing shared dimensions around core fact tables for mutual fund transaction, agent commission, investor holding, fund flow and AUM reporting.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #10202a; }
      .subtitle { font: 18px Arial, Helvetica, sans-serif; fill: #50606b; }
      .section { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: .4px; }
      .table-name { font: 700 20px Arial, Helvetica, sans-serif; fill: #10202a; }
      .col { font: 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .pk { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f766e; }
      .measure { font: 700 14px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .dim { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .fact { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .fact2 { fill: #fdf2f8; stroke: #be185d; stroke-width: 2.5; }
      .note { fill: #fff7ed; stroke: #b7791f; stroke-width: 2; }
      .shadow { filter: drop-shadow(0 8px 16px rgba(15, 23, 42, .10)); }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; }
      .line2 { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1600" height="1000" class="bg"/>
  <text x="64" y="58" class="title">Mutual Fund Data Warehouse Star Schema</text>
  <text x="64" y="90" class="subtitle">Facts and dimensions created by dbt as Delta tables/views for dashboard reporting, lineage and data quality validation</text>

  <rect x="70" y="148" width="250" height="170" rx="16" class="dim shadow"/>
  <text x="96" y="184" class="table-name">dim_date</text>
  <text x="96" y="216" class="pk">PK: date_key,</text>
  <text x="96" y="242" class="col">calendar_date,</text>
  <text x="96" y="268" class="col">month, quarter, year,</text>
  <text x="96" y="294" class="col">financial_period</text>

  <rect x="70" y="418" width="250" height="188" rx="16" class="dim shadow"/>
  <text x="96" y="454" class="table-name">dim_investor</text>
  <text x="96" y="486" class="pk">PK: investor_key,</text>
  <text x="96" y="512" class="col">investor_id,</text>
  <text x="96" y="538" class="col">investor_type,</text>
  <text x="96" y="564" class="col">country, KYC status,</text>
  <text x="96" y="590" class="col">risk_rating</text>

  <rect x="70" y="710" width="250" height="170" rx="16" class="dim shadow"/>
  <text x="96" y="746" class="table-name">dim_agent</text>
  <text x="96" y="778" class="pk">PK: agent_key,</text>
  <text x="96" y="804" class="col">agent_id, agent_code,</text>
  <text x="96" y="830" class="col">agent_name,</text>
  <text x="96" y="856" class="col">channel, country</text>

  <rect x="1280" y="148" width="250" height="188" rx="16" class="dim shadow"/>
  <text x="1306" y="184" class="table-name">dim_fund</text>
  <text x="1306" y="216" class="pk">PK: fund_key,</text>
  <text x="1306" y="242" class="col">fund_id, fund_code,</text>
  <text x="1306" y="268" class="col">fund_name,</text>
  <text x="1306" y="294" class="col">asset_class, currency,</text>
  <text x="1306" y="320" class="col">fund_status</text>

  <rect x="1280" y="418" width="250" height="170" rx="16" class="dim shadow"/>
  <text x="1306" y="454" class="table-name">dim_asset</text>
  <text x="1306" y="486" class="pk">PK: asset_key,</text>
  <text x="1306" y="512" class="col">asset_id, asset_code,</text>
  <text x="1306" y="538" class="col">asset_type, sector,</text>
  <text x="1306" y="564" class="col">country_code</text>

  <rect x="500" y="130" width="270" height="188" rx="16" class="fact shadow"/>
  <text x="528" y="166" class="table-name">fact_transaction</text>
  <text x="528" y="198" class="col">Grain: one settled txn,</text>
  <text x="528" y="224" class="pk">FK: date, investor, agent, fund,</text>
  <text x="528" y="250" class="measure">units, NAV price,</text>
  <text x="528" y="276" class="measure">gross_amount, fee_amount,</text>
  <text x="528" y="302" class="col">transaction_type/status</text>

  <rect x="830" y="130" width="300" height="202" rx="16" class="fact2 shadow"/>
  <text x="858" y="166" class="table-name">fact_agent_commission</text>
  <text x="858" y="192" class="table-name">daily</text>
  <text x="858" y="224" class="col">Grain: agent + fund + day,</text>
  <text x="858" y="250" class="pk">FK: date, agent, fund,</text>
  <text x="858" y="276" class="measure">commission_count,</text>
  <text x="858" y="302" class="measure">commission_amount,</text>
  <text x="858" y="322" class="col">commission_type</text>

  <rect x="500" y="410" width="300" height="196" rx="16" class="fact shadow"/>
  <text x="528" y="446" class="table-name">fact_investor_holding_daily</text>
  <text x="528" y="478" class="col">Grain: investor + fund + day,</text>
  <text x="528" y="504" class="pk">FK: date, investor, fund,</text>
  <text x="528" y="530" class="measure">holding_units,</text>
  <text x="528" y="556" class="measure">NAV price,</text>
  <text x="528" y="582" class="measure">market_value</text>

  <rect x="860" y="410" width="270" height="196" rx="16" class="fact shadow"/>
  <text x="888" y="446" class="table-name">fact_fund_flow_daily</text>
  <text x="888" y="478" class="col">Grain: fund + type + day,</text>
  <text x="888" y="504" class="pk">FK: date, fund,</text>
  <text x="888" y="530" class="measure">subscription_amount,</text>
  <text x="888" y="556" class="measure">redemption_amount,</text>
  <text x="888" y="582" class="measure">net_flow_amount</text>

  <rect x="650" y="708" width="300" height="172" rx="16" class="fact shadow"/>
  <text x="678" y="744" class="table-name">fact_fund_aum_daily</text>
  <text x="678" y="776" class="col">Grain: fund + asset + day,</text>
  <text x="678" y="802" class="pk">FK: date, fund, asset,</text>
  <text x="678" y="828" class="measure">aum_amount,</text>
  <text x="678" y="854" class="measure">nav_price</text>

  <path d="M320 232 H500" class="line"/>
  <path d="M320 232 C450 232 450 224 500 224" class="line2"/>
  <path d="M320 232 C630 350 760 250 830 250" class="line2"/>
  <path d="M320 232 C460 390 450 504 500 504" class="line2"/>
  <path d="M320 232 C610 350 760 504 860 504" class="line2"/>
  <path d="M320 232 C520 640 570 802 650 802" class="line2"/>

  <path d="M320 512 H500" class="line"/>
  <path d="M320 512 C410 420 450 250 500 224" class="line2"/>

  <path d="M320 795 C430 690 440 250 500 224" class="line2"/>
  <path d="M320 795 C520 690 780 270 830 250" class="line2"/>

  <path d="M1280 242 H1130" class="line"/>
  <path d="M1280 242 C1190 242 1190 224 1130 224" class="line2"/>
  <path d="M1280 242 C1160 360 920 478 800 504" class="line2"/>
  <path d="M1280 242 C1160 380 1110 504 1130 504" class="line2"/>
  <path d="M1280 242 C1140 620 1040 802 950 802" class="line2"/>

  <path d="M1280 503 C1140 610 1020 760 950 802" class="line"/>

  <rect x="416" y="910" width="768" height="72" rx="12" class="note"/>
  <text x="448" y="940" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78350f">Star schema is optimized for dashboard filtering by date, investor, agent, fund,</text>
  <text x="448" y="964" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78350f">asset class and transaction type.</text>
</svg>
